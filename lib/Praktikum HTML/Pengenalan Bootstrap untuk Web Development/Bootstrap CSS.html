<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contoh Bootstrap</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Website</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Beranda</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Tentang</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Konten Utama -->
  <div class="container mt-4">
    <div class="row">
      <!-- Kolom 1 -->
      <div class="col-md-4">
        <div class="card">
          <img src="ember.jpg" width="300" alt="Deskripsi gambar">
          <div class="card-body">
            <h5 class="card-title">Andika Pratama Aji Purnomo</h5>
            <p class="card-text">Deskripsi singkat tentang diri Anda.</p>
            <a href="#" class="btn btn-primary">LinkedIn</a>
            <a href="#" class="btn btn-secondary">Instagram</a>
          </div>
        </div>
      </div>
      <!-- Kolom 2 -->
      <div class="col-md-8">
        <h2>Selamat Datang</h2>
        <p>Ini adalah contoh halaman menggunakan Bootstrap. Anda dapat menambahkan konten tambahan di sini sesuai kebutuhan.</p>
        <button class="btn btn-success">Klik Saya</button>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
