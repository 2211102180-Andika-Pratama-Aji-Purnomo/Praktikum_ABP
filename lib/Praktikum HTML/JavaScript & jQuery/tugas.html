<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Validasi Form dengan jQuery & Bootstrap</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="p-4">

  <div class="container">
    <h2>Form Pendaftaran</h2>
    <form id="formPendaftaran" novalidate>
      <div class="mb-3">
        <label for="nama" class="form-label">Nama</label>
        <input type="text" class="form-control" id="nama" placeholder="Masukkan nama">
        <div class="invalid-feedback">Namanya di isi lah kocakkkkkk

        </div>
      </div>
      <button type="submit" class="btn btn-primary">Kirim</button>
    </form>
  </div>

  <script>
    $(document).ready(function () {
      $('#formPendaftaran').on('submit', function (e) {
        e.preventDefault(); // Mencegah form terkirim secara default
        let nama = $('#nama').val().trim();

        if (nama === '') {
          $('#nama').addClass('is-invalid');
        } else {
          $('#nama').removeClass('is-invalid').addClass('is-valid');
          alert('Yeyyyyy Form berhasil dikirim🥰🥰🥰🥰!');
          // Di sini bisa tambahkan logika kirim data ke server
        }
      });

      // Hapus pesan error saat pengguna mulai mengetik
      $('#nama').on('input', function () {
        if ($(this).val().trim() !== '') {
          $(this).removeClass('is-invalid');
        }
      });
    });
  </script>

</body>
</html>
